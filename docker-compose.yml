x-hermes-common-env: &hermes-common-env
  TZ: Pacific/Auckland
  OPENAI_API_KEY: ${MUNINN_MASTER_KEY}
  # The delegation fallback leg (DeepSeek via muninn, model agent-loop)
  # resolves its credential by variable NAME at runtime (key_env:
  # MUNINN_MASTER_KEY), so the name itself must exist in this container.
  # Aliasing it to OPENAI_API_KEY alone is not enough.
  MUNINN_MASTER_KEY: ${MUNINN_MASTER_KEY}
  # The gateway/dashboard processes end up with HOME=/opt/data (their passwd home,
  # set by s6/setuidgid), NOT /opt/data/home. The agy token is mounted at
  # /opt/data/home/.gemini/antigravity-cli, so point the plugin's documented
  # override at the mount regardless of HOME.
  ANTIGRAVITY_CONFIG_DIR: /opt/data/home/.gemini/antigravity-cli
  HERMES_ANTIGRAVITY_CONTEXT_LENGTH: ${HERMES_ANTIGRAVITY_CONTEXT_LENGTH}
  HERMES_AGY_ALLOWED_MODELS: ${HERMES_AGY_ALLOWED_MODELS}
  HERMES_AGY_ALLOWED_EFFORTS: ${HERMES_AGY_ALLOWED_EFFORTS}
  AGENT_MODEL: ${AGENT_MODEL}
  HERMES_CONFIG_SHA: ${HERMES_CONFIG_SHA}
  API_SERVER_KEY: ${API_SERVER_KEY}
  HERMES_API_TIMEOUT: "1800"
  HERMES_STREAM_READ_TIMEOUT: "1800"
  HERMES_STREAM_STALE_TIMEOUT: "1800"
  HERMES_UID: "1000"
  HERMES_GID: "1000"
  DOMAIN_NAME: ${DOMAIN_NAME}
  # TypeSafe Jev API key for high-frequency decision, classification, and triage tasks
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY}
  MNEMOSYNE_DB_PATH: /opt/data/.hermes/mnemosyne/data/mnemosyne.db
  MNEMOSYNE_DATA_DIR: /opt/data/.hermes/mnemosyne/data
  MNEMOSYNE_HOST_LLM_ENABLED: "true"
  MNEMOSYNE_HOST_LLM_TIMEOUT: "120"
  MNEMOSYNE_LLM_ENABLED: ${MNEMOSYNE_LLM_ENABLED}
  MNEMOSYNE_LLM_BASE_URL: ${MNEMOSYNE_LLM_BASE_URL}
  MNEMOSYNE_LLM_API_KEY: ${MUNINN_MASTER_KEY}
  MNEMOSYNE_LLM_MODEL: ${MNEMOSYNE_LLM_MODEL}
  MNEMOSYNE_SKIP_CONTEXTS: flush,subagent,background,skill_loop
  ODYSSEUS_MCP_URL: ${ODYSSEUS_MCP_URL}
  ODYSSEUS_MCP_TOKEN: ${ODYSSEUS_MCP_TOKEN}

services:
  muninn-db:
    image: postgres:16-alpine
    volumes:
      - muninn-db_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=muninn_user
      - POSTGRES_PASSWORD=muninn_password_secret_db_pass
      - POSTGRES_DB=muninn_db
    networks:
      - internal
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  muninn:
    image: ghcr.io/berriai/litellm-database:main-latest
    configs:
      - source: muninn_config
        target: /app/config.yaml
    environment:
      - LITELLM_MASTER_KEY=${MUNINN_MASTER_KEY}
      - DATABASE_URL=postgresql://muninn_user:muninn_password_secret_db_pass@muninn-db:5432/muninn_db
      - LITELLM_SALT_KEY=muninn_salt_secret_key_hash
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - API_SERVER_KEY=${API_SERVER_KEY}
    command: ["--config", "/app/config.yaml"]
    networks:
      - internal
      - aether-net
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.muninn.rule=Host(`muninn.${DOMAIN_NAME}`)"
        - "traefik.http.routers.muninn.entrypoints=websecure"
        - "traefik.http.routers.muninn.tls=true"
        - "traefik.http.routers.muninn.tls.certresolver=cloudflare"
        - "traefik.http.services.muninn.loadbalancer.server.port=4000"
        - "traefik.docker.network=aether-net"
        - "homepage.group=AI Lab"
        - "homepage.name=Muninn Dashboard"
        - "homepage.icon=litellm.png"
        - "homepage.href=https://muninn.${DOMAIN_NAME}/ui"
        - "homepage.description=LiteLLM Prompt & Response Observability"

  jev-shim:
    image: ${REGISTRY_PREFIX}jev-shim:${STACK_NAME}
    build:
      context: ./jev-shim
      dockerfile: Dockerfile
    environment:
      - TYPESAFE_API_KEY=${TYPESAFE_API_KEY}
      - TYPESAFE_ENDPOINT=${TYPESAFE_ENDPOINT}
      - TYPESAFE_DEFAULT_MODEL=${TYPESAFE_DEFAULT_MODEL}
      - PORT=8000
    networks:
      - internal
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  huginn-gateway:
    image: ${REGISTRY_PREFIX}hermes-agent:${STACK_NAME}
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    user: "0:0"
    command: /entrypoint.sh
    volumes:
      - /opt/odin/hermes:/opt/data
      - /opt/odin/mnemosyne:/opt/data/.hermes/mnemosyne
      - ${HOST_AGY_CONFIG_DIR}:/opt/data/home/.gemini/antigravity-cli
      - ${OBSIDIAN_VAULT_PATH}:/app/vault:rw
    environment:
      <<: *hermes-common-env
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 0.0.0.0
      API_SERVER_PORT: "8642"
      GATEWAY_ALLOW_ALL_USERS: "true"
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DISCORD_ALLOWED_USERS: ${DISCORD_USER_ID}
      DISCORD_USER_ID: ${DISCORD_USER_ID}
      DISCORD_CHANNEL_INFO_ID: ${DISCORD_CHANNEL_INFO_ID}
      DISCORD_CHANNEL_HEALTH_ID: ${DISCORD_CHANNEL_HEALTH_ID}
      DISCORD_CHANNEL_WEALTH_ID: ${DISCORD_CHANNEL_WEALTH_ID}
      DISCORD_CHANNEL_WATCH_ID: ${DISCORD_CHANNEL_WATCH_ID}
      DISCORD_CHANNEL_ALERT_ID: ${DISCORD_CHANNEL_ALERT_ID}
      # write_file/patch are confined to HERMES_WRITE_SAFE_ROOT, which the base
      # image pins to /opt/data. Without /app/vault in the list, every edit to the
      # vault bind mount is denied and has to be routed around via the terminal.
      # The credential denylist is evaluated separately and stays in force.
      HERMES_WRITE_SAFE_ROOT: /opt/data:/app/vault
      SEARXNG_URL: http://poseidon_searxng:8080
      CAMOFOX_URL: http://poseidon_camofox:9377
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      GIT_USER_NAME: ${HERMES_GIT_USER_NAME}
      GIT_USER_EMAIL: ${HERMES_GIT_USER_EMAIL}
      GH_SETUP_TOKEN: ${GH_TOKEN}
      GH_CONFIG_DIR: /opt/data/.config/gh
      # Read-only Docker API for investigating Swarm services, tasks and logs
      # from inside this container. The socket is NOT mounted here -- only into
      # docker-socket-proxy, which enforces GET/HEAD-only at the API level.
      # Mutations (stack deploy, service update, exec) stay on the PR +
      # `gh workflow run deploy` path, which is the point of the split.
      DOCKER_HOST: tcp://docker-socket-proxy:2375
    secrets:
      - source: hermes_ssh_key
        target: hermes_ssh_key
    networks:
      - internal
      - aether-net
      - docker-socket
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        # Router for Huginn API (Port 8642)
        - "traefik.http.routers.huginn-api.rule=Host(`agent.${DOMAIN_NAME}`)"
        - "traefik.http.routers.huginn-api.entrypoints=websecure"
        - "traefik.http.routers.huginn-api.tls=true"
        - "traefik.http.routers.huginn-api.tls.certresolver=cloudflare"
        - "traefik.http.routers.huginn-api.service=huginn-api"
        - "traefik.http.services.huginn-api.loadbalancer.server.port=8642"
        - "traefik.docker.network=aether-net"

  huginn-dashboard:
    image: ${REGISTRY_PREFIX}hermes-agent:${STACK_NAME}
    build:
      context: ./hermes-agent
      dockerfile: Dockerfile
    user: "0:0"
    entrypoint: ["/entrypoint.sh", "dashboard"]
    volumes:
      - /opt/odin/hermes:/opt/data
      - /opt/odin/mnemosyne:/opt/data/.hermes/mnemosyne
      - ${HOST_AGY_CONFIG_DIR}:/opt/data/home/.gemini/antigravity-cli
    environment:
      <<: *hermes-common-env
      GATEWAY_HEALTH_URL: http://huginn-gateway:8642
    networks:
      - aether-net
      - internal
    depends_on:
      - huginn-gateway
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        # Router for Huginn Dashboard (Port 9119)
        - "traefik.http.routers.huginn-dashboard.rule=Host(`huginn.${DOMAIN_NAME}`)"
        - "traefik.http.routers.huginn-dashboard.entrypoints=websecure"
        - "traefik.http.routers.huginn-dashboard.tls=true"
        - "traefik.http.routers.huginn-dashboard.tls.certresolver=cloudflare"
        - "traefik.http.routers.huginn-dashboard.middlewares=authelia"
        - "traefik.http.routers.huginn-dashboard.service=huginn-dashboard"
        - "traefik.http.services.huginn-dashboard.loadbalancer.server.port=9120"
        - "traefik.docker.network=aether-net"
        - "homepage.group=AI Lab"
        - "homepage.name=Huginn Dashboard"
        - "homepage.icon=hermes.png"
        - "homepage.href=https://huginn.${DOMAIN_NAME}"
        - "homepage.description=Hermes Agent Web UI"

  mnemosyne-dashboard:
    image: ${REGISTRY_PREFIX}mnemosyne-dashboard:${STACK_NAME}
    build:
      context: ./mnemosyne-dashboard
      dockerfile: Dockerfile
    volumes:
      # Mount the Mnemosyne host directory for SQLite WAL shared-memory coordination
      - /opt/odin/mnemosyne:/opt/data
    environment:
      - PYTHONUNBUFFERED=1
      - MNEMOSYNE_DASHBOARD_PORT=8080
      - MNEMOSYNE_DASHBOARD_DB=/opt/data/data/mnemosyne.db
      - MNEMOSYNE_DASHBOARD_HOST=0.0.0.0
      - TZ=Pacific/Auckland
    networks:
      - aether-net
      - internal
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.mnemosyne-db.rule=Host(`mnemosyne.${DOMAIN_NAME}`)"
        - "traefik.http.routers.mnemosyne-db.entrypoints=websecure"
        - "traefik.http.routers.mnemosyne-db.tls=true"
        - "traefik.http.routers.mnemosyne-db.tls.certresolver=cloudflare"
        - "traefik.http.routers.mnemosyne-db.middlewares=authelia"
        - "traefik.http.services.mnemosyne-db.loadbalancer.server.port=8080"
        - "traefik.docker.network=aether-net"
        - "homepage.group=AI Lab"
        - "homepage.name=Mnemosyne Dashboard"
        - "homepage.icon=brain.png"
        - "homepage.href=https://mnemosyne.${DOMAIN_NAME}"
        - "homepage.description=Memory Store Visualizer & Event Inspector"

  # Read-only Docker API for Huginn. Answers the "which task actually
  # restarted, and what did it log before it died?" class of question without
  # a shell on Gaia.
  #
  # Read-only is enforced by the proxy, not by the mount. POST=0 is the whole
  # boundary: the API only accepts GET/HEAD, so writes, exec, pulls and stack
  # deploys are refused with 403 whoever asks. Worth being explicit about,
  # because `:ro` on a socket bind mount does NOT do this -- read-only there
  # protects the socket file, while the API behind it stays fully writable.
  #
  # Deliberately NOT on `internal`: dedicated non-attachable overlay with
  # exactly two members (`huginn-gateway` and `docker-socket-proxy`) so
  # `docker inspect` environment views stay isolated from `internal` peers.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      # GET/HEAD only. Also implicitly denies every ALLOW_START/STOP/... knob.
      - POST=0
      # Granted read surface (image default is deny).
      - CONTAINERS=1
      - SERVICES=1
      - TASKS=1
      - NODES=1
      - INFO=1
      - IMAGES=1
      - VOLUMES=1
      - NETWORKS=1
      - SWARM=1
      - EVENTS=1
      - PING=1
      - VERSION=1
      # Redundant with POST=0, stated anyway so nobody flips POST later without
      # noticing what else it would unlock.
      - EXEC=0
      - SECRETS=0
      - CONFIGS=0
    networks:
      - docker-socket
    labels:
      - "com.docker.compose.project=${STACK_NAME}"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M

volumes:
  muninn-db_data:

networks:
  aether-net:
    external: true
  internal:
    driver: overlay
    attachable: true
  # Dedicated overlay for the read-only Docker API. Not attachable, no external
  # connectivity: the only members are huginn-gateway and docker-socket-proxy.
  docker-socket:
    driver: overlay
    internal: true

configs:
  muninn_config:
    file: ./config/muninn/config.yaml
secrets:
  hermes_ssh_key:
    external: true
    name: ${HERMES_SSH_KEY_NAME}
