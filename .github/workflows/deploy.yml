name: Deploy Odin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]
    env:
      OLLAMA_BASE_MODEL: qwen3.5:9b
      OLLAMA_MODEL_NAME: local-model:latest
      OLLAMA_CONTEXT_LENGTH: 16384
      # Main agent loop runs on the Antigravity subscription first (fixed monthly
      # fee), starting with Gemini 3.8 Flash, rotating to Claude Sonnet 5.5, Gemini 4
      # Argon, and finally DeepSeek V4-Flash via muninn. This must name a model
      # the agy plugin exposes (gemini-3.8-flash-high, claude-sonnet-5-5-high, ...),
      # NOT a muninn alias like `agent-loop`.
      AGENT_MODEL: gemini-3.8-flash-high
      CHAT_MODEL: local-model:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Secrets
        env:
          LLDAP_LDAP_USER_PASS: ${{ secrets.LLDAP_LDAP_USER_PASS }}
          HERMES_SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          WEBUI_SECRET_KEY: ${{ secrets.WEBUI_SECRET_KEY }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          
          # Resolve the external LLDAP password secret name from Cerberus
          echo "LLDAP_LDAP_USER_PASS_NAME=$(echo "$LLDAP_LDAP_USER_PASS" | /tmp/ensure_secret.sh cerberus_lldap_user_pass)" >> $GITHUB_ENV
          
          # Resolve the external Hermes SSH key secret name if provided
          if [ -n "$HERMES_SSH_KEY" ]; then
            echo "HERMES_SSH_KEY_NAME=$(echo "$HERMES_SSH_KEY" | /tmp/ensure_secret.sh hermes_ssh_key)" >> $GITHUB_ENV
          else
            echo "HERMES_SSH_KEY_NAME=" >> $GITHUB_ENV
          fi

          # Resolve the external WEBUI_SECRET_KEY secret name
          echo "WEBUI_SECRET_KEY_NAME=$(echo "$WEBUI_SECRET_KEY" | /tmp/ensure_secret.sh odin_webui_secret_key)" >> $GITHUB_ENV

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tienzo.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_RAW_PASSWORD }}

      - name: Deploy Stack
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          OBSIDIAN_VAULT_PATH: ${{ vars.OBSIDIAN_VAULT_PATH }}
          LLDAP_LDAP_BASE_DN: ${{ vars.LLDAP_LDAP_BASE_DN }}
          LLDAP_LDAP_USER_PASS_NAME: ${{ env.LLDAP_LDAP_USER_PASS_NAME }}
          HERMES_SSH_KEY_NAME: ${{ env.HERMES_SSH_KEY_NAME }}
          WEBUI_SECRET_KEY_NAME: ${{ env.WEBUI_SECRET_KEY_NAME }}
          HERMES_GIT_USER_NAME: ${{ vars.HERMES_GIT_USER_NAME || 'Huginn' }}
          HERMES_GIT_USER_EMAIL: ${{ secrets.HERMES_GIT_USER_EMAIL || 'huginn@tienzo.net' }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ALLOWED_USERS: ${{ vars.DISCORD_ALLOWED_USERS }}
          MUNINN_MASTER_KEY: ${{ secrets.MUNINN_MASTER_KEY || 'sk-muninn-insecure-master-key' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          API_SERVER_KEY: ${{ secrets.API_SERVER_KEY }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          MNEMOSYNE_LLM_ENABLED: ${{ vars.MNEMOSYNE_LLM_ENABLED }}
          MNEMOSYNE_LLM_BASE_URL: ${{ vars.MNEMOSYNE_LLM_BASE_URL }}
          MNEMOSYNE_LLM_MODEL: ${{ vars.MNEMOSYNE_LLM_MODEL }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Odin git backup
          ODIN_GIT_REPO_URL: ${{ vars.ODIN_GIT_REPO_URL }}
          ODIN_GIT_USER_EMAIL: ${{ secrets.ODIN_GIT_USER_EMAIL || 'huginn@tienzo.net' }}
          ODIN_GIT_USER_NAME: ${{ vars.ODIN_GIT_USER_NAME || 'Huginn' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY || '' }}
          # Bearer token for the Kratos MCP endpoint, injected into the agent
          # container as MCP_KRATOS_API_KEY (see docker-compose.yml). Same value
          # as the kratos repo's KRATOS_MCP_TOKEN; kept as one named secret so
          # the server that issues the token and the client that presents it
          # cannot drift apart.
          MCP_KRATOS_API_KEY: ${{ secrets.KRATOS_MCP_TOKEN || '' }}
          HOST_AGY_CONFIG_DIR: ${{ vars.HOST_AGY_CONFIG_DIR || '/home/raymund/.gemini/antigravity-cli' }}
        run: |
          # Create backup directory for huginn-backup if it doesn't exist
          docker run --rm -v /mnt/storage/backups/odin/hermes:/backup alpine sh -c "mkdir -p /backup && chown -R 1000:1000 /backup && chmod 775 /backup"

          # Expand config templates
          python3 -c "import os; open('config/hermes/config.yaml', 'w').write(os.path.expandvars(open('config/hermes/config.yaml.template').read()))"
          python3 -c "import os; open('config/muninn/config.yaml', 'w').write(os.path.expandvars(open('config/muninn/config.yaml.template').read()))"
          
          # Write config files and fix permissions on host directories (UID 1000, GID 1000)
          docker run --rm -v /opt/odin/mnemosyne:/opt/mnemosyne alpine sh -c "chown -R 1000:1000 /opt/mnemosyne && chmod 775 /opt/mnemosyne"
          docker run --rm -i -v /opt/odin/hermes:/opt/data alpine sh -c "mkdir -p /opt/data && cat > /opt/data/config.yaml && chown -R 1000:1000 /opt/data && chmod -R 775 /opt/data && chmod 664 /opt/data/config.yaml" < config/hermes/config.yaml
          
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "odin" docker-compose.yml
