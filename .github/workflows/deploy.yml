name: Deploy Odin

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: [self-hosted, gaia]
    env:
      OLLAMA_BASE_MODEL: qwen3.5:9b
      OLLAMA_MODEL_NAME: local-model:latest
      OLLAMA_CONTEXT_LENGTH: 16384
      # Main agent loop runs on the flat-rate Antigravity subscription first,
      # starting with Gemini 3.8 Flash, rotating to Claude Sonnet 5.5, then
      # Gemini 4 Argon, and falling back to DeepSeek via muninn only when all
      # three flat-rate subscription pools are exhausted.
      AGENT_MODEL: gemini-3.8-flash-high
      CHAT_MODEL: local-model:latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Secrets
        env:
          LLDAP_LDAP_USER_PASS: ${{ secrets.LLDAP_LDAP_USER_PASS }}
          HERMES_SSH_KEY: ${{ secrets.HERMES_SSH_KEY }}
          WEBUI_SECRET_KEY: ${{ secrets.WEBUI_SECRET_KEY }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/ensure_secret.sh -o /tmp/ensure_secret.sh
          chmod +x /tmp/ensure_secret.sh
          
          # Resolve the external LLDAP password secret name from Cerberus
          echo "LLDAP_LDAP_USER_PASS_NAME=$(echo "$LLDAP_LDAP_USER_PASS" | /tmp/ensure_secret.sh cerberus_lldap_user_pass)" >> $GITHUB_ENV
          
          # Resolve the external Hermes SSH key secret name if provided
          if [ -n "$HERMES_SSH_KEY" ]; then
            echo "HERMES_SSH_KEY_NAME=$(echo "$HERMES_SSH_KEY" | /tmp/ensure_secret.sh hermes_ssh_key)" >> $GITHUB_ENV
          else
            echo "HERMES_SSH_KEY_NAME=" >> $GITHUB_ENV
          fi

          # Resolve the external WEBUI_SECRET_KEY secret name
          echo "WEBUI_SECRET_KEY_NAME=$(echo "$WEBUI_SECRET_KEY" | /tmp/ensure_secret.sh odin_webui_secret_key)" >> $GITHUB_ENV

      - name: Log in to Registry
        uses: docker/login-action@v3
        with:
          registry: registry.tienzo.net
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_RAW_PASSWORD }}

      - name: Validate Required Configuration
        env:
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          LLDAP_LDAP_BASE_DN: ${{ vars.LLDAP_LDAP_BASE_DN }}
          MUNINN_MASTER_KEY: ${{ secrets.MUNINN_MASTER_KEY }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
          DISCORD_CHANNEL_INFO_ID: ${{ vars.DISCORD_CHANNEL_INFO_ID }}
          API_SERVER_KEY: ${{ secrets.API_SERVER_KEY }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          KRATOS_MCP_TOKEN: ${{ secrets.KRATOS_MCP_TOKEN }}
        run: |
          MISSING=""
          [ -z "$DOMAIN_NAME" ] && MISSING="$MISSING DOMAIN_NAME"
          [ -z "$LLDAP_LDAP_BASE_DN" ] && MISSING="$MISSING LLDAP_LDAP_BASE_DN"
          [ -z "$MUNINN_MASTER_KEY" ] && MISSING="$MISSING MUNINN_MASTER_KEY"
          [ -z "$DISCORD_BOT_TOKEN" ] && MISSING="$MISSING DISCORD_BOT_TOKEN"
          [ -z "$DISCORD_USER_ID" ] && MISSING="$MISSING DISCORD_USER_ID"
          [ -z "$DISCORD_CHANNEL_INFO_ID" ] && MISSING="$MISSING DISCORD_CHANNEL_INFO_ID"
          [ -z "$API_SERVER_KEY" ] && MISSING="$MISSING API_SERVER_KEY"
          [ -z "$GH_TOKEN" ] && MISSING="$MISSING GH_TOKEN"
          [ -z "$KRATOS_MCP_TOKEN" ] && MISSING="$MISSING KRATOS_MCP_TOKEN"
          if [ -n "$MISSING" ]; then
            echo "::error::Deployment halted: missing required configuration:$MISSING" >&2
            exit 1
          fi

      - name: Deploy Stack
        env:
          STACK_NAME: odin
          DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
          OBSIDIAN_VAULT_PATH: ${{ vars.OBSIDIAN_VAULT_PATH || '/opt/atlas/vault' }}
          LLDAP_LDAP_BASE_DN: ${{ vars.LLDAP_LDAP_BASE_DN }}
          LLDAP_LDAP_USER_PASS_NAME: ${{ env.LLDAP_LDAP_USER_PASS_NAME }}
          HERMES_SSH_KEY_NAME: ${{ env.HERMES_SSH_KEY_NAME }}
          WEBUI_SECRET_KEY_NAME: ${{ env.WEBUI_SECRET_KEY_NAME }}
          HERMES_GIT_USER_NAME: ${{ vars.HERMES_GIT_USER_NAME || 'Huginn' }}
          HERMES_GIT_USER_EMAIL: ${{ secrets.HERMES_GIT_USER_EMAIL }}
          DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
          DISCORD_ALLOWED_USERS: ${{ vars.DISCORD_USER_ID }}
          DISCORD_USER_ID: ${{ vars.DISCORD_USER_ID }}
          DISCORD_CHANNEL_INFO_ID: ${{ vars.DISCORD_CHANNEL_INFO_ID }}
          DISCORD_CHANNEL_HEALTH_ID: ${{ vars.DISCORD_CHANNEL_HEALTH_ID }}
          DISCORD_CHANNEL_WEALTH_ID: ${{ vars.DISCORD_CHANNEL_WEALTH_ID }}
          DISCORD_CHANNEL_WATCH_ID: ${{ vars.DISCORD_CHANNEL_WATCH_ID }}
          DISCORD_CHANNEL_ALERT_ID: ${{ vars.DISCORD_CHANNEL_ALERT_ID }}
          KANBAN_DISCORD_CHANNEL_ID: ${{ vars.DISCORD_CHANNEL_INFO_ID }}
          KANBAN_DEFAULT_ASSIGNEE: ${{ vars.KANBAN_DEFAULT_ASSIGNEE || 'swarm-worker' }}
          MUNINN_MASTER_KEY: ${{ secrets.MUNINN_MASTER_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          API_SERVER_KEY: ${{ secrets.API_SERVER_KEY }}
          REGISTRY_PREFIX: ${{ vars.REGISTRY_PREFIX }}
          MNEMOSYNE_LLM_ENABLED: ${{ vars.MNEMOSYNE_LLM_ENABLED || 'true' }}
          MNEMOSYNE_LLM_BASE_URL: ${{ vars.MNEMOSYNE_LLM_BASE_URL || 'http://muninn:4000/v1' }}
          MNEMOSYNE_LLM_MODEL: ${{ vars.MNEMOSYNE_LLM_MODEL || 'memory-extract' }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          # Odin git backup
          ODIN_GIT_REPO_URL: ${{ vars.ODIN_GIT_REPO_URL }}
          ODIN_GIT_USER_EMAIL: ${{ secrets.ODIN_GIT_USER_EMAIL }}
          ODIN_GIT_USER_NAME: ${{ vars.ODIN_GIT_USER_NAME || 'Huginn' }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          TYPESAFE_ENDPOINT: ${{ vars.TYPESAFE_ENDPOINT || 'https://api.typesafe.ai/v1/systemone' }}
          TYPESAFE_DEFAULT_MODEL: ${{ vars.TYPESAFE_DEFAULT_MODEL || 'jev-latest' }}
          # Bearer token for the Kratos MCP endpoint, injected from organization
          # secret KRATOS_MCP_TOKEN.
          KRATOS_MCP_TOKEN: ${{ secrets.KRATOS_MCP_TOKEN }}
          MCP_KRATOS_API_KEY: ${{ secrets.KRATOS_MCP_TOKEN }}
          HOST_AGY_CONFIG_DIR: ${{ vars.HOST_AGY_CONFIG_DIR || '/home/raymund/.gemini/antigravity-cli' }}
          OLLAMA_NUM_THREADS: ${{ vars.OLLAMA_NUM_THREADS }}
          OLLAMA_CONTEXT_LENGTH: ${{ vars.OLLAMA_CONTEXT_LENGTH || '16384' }}
        run: |
          # Create backup directory for huginn-backup if it doesn't exist
          docker run --rm -v /mnt/storage/backups/odin/hermes:/backup alpine sh -c "mkdir -p /backup && chown -R 1000:1000 /backup && chmod 775 /backup"

          # Expand config templates (specialist profiles are rendered non-destructively in /opt/odin/hermes/profiles)
          python3 -c "import os; open('config/hermes/config.yaml', 'w').write(os.path.expandvars(open('config/hermes/config.yaml.template').read()))"
          python3 -c "import os; open('config/muninn/config.yaml', 'w').write(os.path.expandvars(open('config/muninn/config.yaml.template').read()))"
          python3 config/hermes/profiles/render_profiles.py --template config/hermes/config.yaml.template --roles config/hermes/profiles/roles.json --output-dir /opt/odin/hermes/profiles --skills-source /opt/odin/hermes/skills --symlink-target-prefix /opt/data/skills
          
          # Write config files and preserve strict private-node permissions on control sockets/locks/SSH keys
          docker run --rm -v /opt/odin/mnemosyne:/opt/mnemosyne alpine sh -c "chown -R 1000:1000 /opt/mnemosyne && chmod 775 /opt/mnemosyne"
          docker run --rm -i -v /opt/odin/hermes:/opt/data alpine sh -c "mkdir -p /opt/data /opt/data/profiles && cat > /opt/data/config.yaml && chmod 644 /opt/data/config.yaml && chown -R 1000:1000 /opt/data && chmod 755 /opt/data /opt/data/profiles /opt/data/profiles/* 2>/dev/null || true && chmod 600 /opt/data/gateway.sock /opt/data/gateway.lock /opt/data/profiles/*/gateway.lock 2>/dev/null || true" < config/hermes/config.yaml
          
          curl -fsSL https://raw.githubusercontent.com/yggdrasil-lab/yggdrasil-os/main/deploy/deploy.sh -o /tmp/deploy.sh
          chmod +x /tmp/deploy.sh
          /tmp/deploy.sh "odin" docker-compose.yml
